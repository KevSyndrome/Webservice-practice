spring.application.name=api
# PORT lo asigna Railway; en local se usa 8090 (8080 lo ocupa otro servicio)
server.port=${PORT:8090}
# Errores REST en formato estándar RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true
# SOAP: endpoint en /ws, WSDL en /ws/products.wsdl con la URL real del host
spring.webservices.path=/ws
spring.webservices.servlet.init.transformWsdlLocations=true
# WS externos consumidos por la API (patrón BFF: el portal nunca los llama directo)
external.countryinfo.url=http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
external.openmeteo.url=https://api.open-meteo.com
# SQLite: en local api.db junto a la app (ignorado en git); en Railway /data/api.db, en el volumen
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:api.db}
spring.sql.init.mode=always
# SQLite admite un solo escritor a la vez; con más conexiones aparecen errores SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1
# GraphQL en /graphql, con el explorador GraphiQL en /graphiql
spring.graphql.graphiql.enabled=true
# gRPC escucha en su propio puerto (HTTP/2), separado del 8090
spring.grpc.server.port=9095
external.countries-graphql.url=https://countries.trevorblades.com/graphql
external.grpcbin.address=grpcb.in:9001
