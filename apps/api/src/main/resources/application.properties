spring.application.name=api
# 8080 lo ocupa otro servicio local (MongoDB Relational Migrator en Docker)
server.port=8090
# Errores REST en formato estándar RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true
# SOAP: endpoint en /ws, WSDL en /ws/products.wsdl con la URL real del host
spring.webservices.path=/ws
spring.webservices.servlet.init.transformWsdlLocations=true
# WS externos consumidos por la API (patrón BFF: el portal nunca los llama directo)
external.countryinfo.url=http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
external.openmeteo.url=https://api.open-meteo.com
